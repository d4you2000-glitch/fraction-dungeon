<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>분수 던전 온라인 모둠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 초등 5~6학년이 몰입하는 횃불 던전 탐험, 짧고 신나는 말투
   IDEA: 어두운 지하 미궁을 등불 하나로 탐험하는 탑뷰 RPG. 전투와 문제는 던전 안에서 바로 벌어진다
   PICTURE: 캔버스에 그린 벽돌 미궁, 몬스터 머리 위 분수 표지판, 화면 아래 무기 카드
   COLOUR and TYPE: 밤 던전 고정 팔레트(돌 보라 #1a1524, 횃불 주황 #ffb03a, 마법 민트 #5ee6c0), Black Han Sans + Jua
   LAYOUT: 상태줄 → 탐험 화면(가장 크게, 위에 말풍선 기록, 아래에 무기 카드 패널) → 안내 */
:root{color-scheme:dark;--bg:#0d0a13;--stone:#211a2d;--stone2:#2e2540;--line:#3d3254;--ink:#f4ead6;--dim:#b9aec8;--torch:#ffb03a;--fire:#ff6a3d;--mint:#5ee6c0;--bad:#ff5d6c;--ice:#8fd8ff;--gold:#ffd27a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:10px 10px 18px}
.play{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.side{display:none;background:var(--stone);border:2px solid var(--line);border-radius:18px;padding:10px;align-self:start}
.side h4{margin:0 0 6px;font-family:"Black Han Sans";font-weight:400;font-size:18px;color:var(--torch)}
#mm{width:100%;aspect-ratio:46/36;display:block;border-radius:10px;background:#05030a}
.goalbox{margin-top:8px;font-size:15px}.goalbox b{color:var(--torch);font-weight:400}
.legend{font-size:13px;color:var(--dim);margin:8px 0 0;line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:middle}
.mini{position:absolute;right:8px;top:8px;width:128px;height:auto;aspect-ratio:46/36;display:block;border:2px solid var(--line);border-radius:10px;background:#05030acc;z-index:4;cursor:pointer}
.mini.big{width:calc(100% - 16px);top:50px}
.pill.goal{color:var(--mint);border-color:#2f5a52}
.pill.party{font-size:14px}.pill.party .on{color:var(--torch)}.pill.party .dn{color:#6a5c82;text-decoration:line-through}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin:6px 0}
.prow input{font:inherit;font-size:16px;background:#18121f;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink);min-height:42px;width:100%}
.prow .pc{display:flex;gap:4px}.prow .pc button{background:var(--stone2);border:2px solid transparent;border-radius:10px;padding:2px;width:46px;height:46px}
.prow .pc button img{width:38px;height:38px;display:block}
.prow .pc button[aria-pressed=true]{border-color:var(--torch);background:#3d2f22}
.guide{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:10px;align-items:center;background:#0b0811ee;border:2px solid var(--torch);border-radius:16px;padding:10px 12px;z-index:5;font-size:17px;line-height:1.45}
.guide img{width:58px;height:58px;flex:none}
.guide .gt{flex:1}.guide .gt b{color:var(--torch);font-weight:400}
.guide{padding-top:14px}.guide button{position:absolute;right:8px;top:-16px;background:var(--stone2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;min-height:32px}
.gtip{background:#2a2010;border:1px solid #6a5020;border-radius:10px;padding:6px 10px;margin-bottom:5px;color:var(--gold);font-size:17px}
.hintbox{background:#0f2a24;border:2px solid var(--mint);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.hintbox .ht{font-size:16px;color:var(--mint);margin-bottom:6px}
.hrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:4px 0}
.hrow .hl{flex:none;width:96px;font-size:15px;color:var(--ink)}.hrow .hl b{font-family:"Black Han Sans";font-weight:400;font-size:20px;color:var(--gold)}
.hc{min-width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-family:"Black Han Sans";font-size:19px;background:#2a2540;color:#8a7fa8;padding:0 6px}
.hc.on{background:#5ee6c0;color:#0b2a24;box-shadow:0 0 10px #5ee6c088}.hc.max{background:#ffd27a;color:#3a2000;box-shadow:0 0 12px #ffd27a;outline:2px solid #fff}
.hfoot{font-size:15px;margin-top:4px}.hfoot b{color:var(--gold);font-weight:400}
@media(max-width:420px){.hrow .hl{width:78px;font-size:13px}.hc{min-width:30px;height:30px;font-size:17px}}
.king{background:#18121f;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 12px;text-align:left}
.king .town{display:flex;gap:4px;justify-content:space-between;align-items:flex-end;background:linear-gradient(#1a1430 0,#1a1430 60%,#2a3a24 60%);border-radius:12px;padding:8px 6px 4px;margin:6px 0}
.king .bd{flex:1;text-align:center;font-size:28px;line-height:1.1}.king .bd small{display:block;font-size:10px;color:var(--dim)}
.king .bd.lock{filter:grayscale(1) opacity(.25)}
.king .lv{display:flex;align-items:center;gap:4px 8px;font-size:15px;margin:4px 0;flex-wrap:wrap}
.king .lv .nm{flex:1;min-width:0;overflow-wrap:break-word}
.king .lv .xpbar{flex-basis:100%;order:3}
.king .lv .inf{order:4;font-size:13px;color:var(--dim)}
.king .lv b{font-family:"Black Han Sans";font-weight:400;color:var(--torch);font-size:18px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:#0b0811;border-radius:5px;overflow:hidden;min-width:60px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--torch))}
.album{display:grid;gap:6px;margin:10px 0;text-align:left}
.arow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.arow>span{width:52px;flex:none;font-size:13px;color:var(--dim)}.arow>span.done{color:var(--torch)}
.acard{width:42px;height:54px;border-radius:9px;background:#18121f;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#5d5073;font-size:14px}
.acard.got{background:#fff4e0;border-color:#ffb03a;color:#1a1222}.acard.got .fr{font-size:17px}
.acard.shiny{background:linear-gradient(135deg,#fff4e0,#ffe08a,#fff4e0);box-shadow:0 0 12px #ffd27a;border-color:#fff}
.atabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.atabs button{background:var(--stone2);border-radius:99px;padding:4px 12px;min-height:36px;border:2px solid transparent}.atabs button[aria-pressed=true]{border-color:var(--torch)}
.onl{background:#0f2a3a;border:2px solid #2a6a8a;border-radius:16px;padding:10px 12px;margin:10px 0;text-align:left}
.onl .ot{font-family:"Black Han Sans";font-size:18px;color:#8fd8ff}
.onl .orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:6px}
.onl input{font:inherit;font-size:20px;letter-spacing:.2em;text-align:center;background:#071a24;border:2px solid #2a6a8a;border-radius:12px;padding:6px;color:var(--ink);min-height:46px;width:100%}
.code{font-family:"Black Han Sans";font-size:56px;letter-spacing:.15em;color:#8fd8ff;line-height:1.1}
.roster{display:grid;gap:6px;margin:10px 0;text-align:left}.roster div{display:flex;align-items:center;gap:8px;background:#18121f;border-radius:12px;padding:6px 10px}
.roster img{width:36px;height:36px}
.nstat{font-size:14px;color:var(--dim);min-height:20px}
.sosbox{position:absolute;left:8px;right:8px;top:56px;background:#2a0f2a;border:3px solid #ff9ad5;border-radius:16px;padding:10px;z-index:8;text-align:center}
.sosbox .sq{font-size:17px;margin-bottom:6px}.sosbox .sq .fr{font-size:30px}
.sosbox .sb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sosbox .sb button{background:#fff4e0;color:#1a1222;border-radius:10px;min-height:52px;font-family:"Black Han Sans";font-size:26px}
.sosbox .sx{margin-top:6px;background:var(--stone2);border-radius:10px;padding:4px 14px;min-height:36px}
.downbox{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#0b0811ee;border:2px solid var(--bad);border-radius:16px;padding:14px 18px;z-index:8;text-align:center;font-size:18px;width:max-content;max-width:90%}
.choices button.tipd{outline:4px solid #ff9ad5;outline-offset:2px}
.choices button .tipn{position:absolute;top:-10px;right:-4px;background:#ff9ad5;color:#2a0f2a;border-radius:99px;padding:0 6px;font-family:Jua;font-size:12px}
.choices button{position:relative}
.btn.tut{background:linear-gradient(#5ee6c0,#2a9a80);color:#0b0811}
.cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1}
.cls button{background:var(--stone2);border:2px solid transparent;border-radius:12px;padding:6px 4px;font-size:15px;line-height:1.2}
.cls button img{width:52px;height:52px;display:block;margin:0 auto}
.cls button small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.cls button[aria-pressed=true]{border-color:var(--torch);background:#3d2f22}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0;text-align:center}
.badge{background:#18121f;border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:13px;color:var(--dim)}
.badge .bi{font-size:34px;display:block;filter:grayscale(1) opacity(.35)}
.badge strong{display:block;font-weight:400;color:var(--ink);font-size:15px}
.badge.got{border-color:var(--torch);background:#2a2010}.badge.got .bi{filter:none}
.achpop{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:linear-gradient(#5a4520,#2a2010);border:2px solid var(--gold);border-radius:16px;padding:8px 18px;z-index:30;font-size:17px;box-shadow:0 0 30px #ffd27a66;animation:achin 3.2s forwards;pointer-events:none;white-space:nowrap}
@keyframes achin{0%{opacity:0;transform:translate(-50%,-30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.stage.dim::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 160px 60px #2a0a4acc}
.stage.fire::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 160px 50px #ff4a1a88;animation:fl 1s ease-in-out infinite alternate}
@keyframes fl{to{box-shadow:inset 0 0 200px 70px #ff6a1aaa}}
@media(min-width:860px){.play{grid-template-columns:250px minmax(0,1fr)}.side{display:block}.mini{display:none}}
@media(max-width:859px){.toast{left:8px;transform:none;max-width:calc(100% - 152px);text-align:left}}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.top h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:24px;margin:0 auto 0 0;color:var(--torch)}
.pill{background:var(--stone);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:15px;white-space:nowrap}
.pill.combo{color:var(--fire);border-color:var(--fire)}
.pill.btnp{cursor:pointer;min-height:32px}
.hearts{color:var(--bad);letter-spacing:1px}
.stage{position:relative;height:clamp(470px,78vh,720px);border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#05030a}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage.hurt::after{content:"";position:absolute;inset:0;pointer-events:none;animation:hurt .45s;z-index:9}
@keyframes hurt{0%,100%{box-shadow:inset 0 0 0 0 #ff2a3c00}30%{box-shadow:inset 0 0 90px 30px #ff2a3caa}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0b0811e6;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;width:max-content;max-width:92%;z-index:6}
.toast.on{opacity:1}
.help{color:var(--dim);font-size:14px;text-align:center;margin:8px 0 0}
/* 화면 안 전투 */
.elog{position:absolute;left:8px;right:8px;top:8px;background:#0b0811e8;border:1px solid var(--line);border-radius:14px;padding:7px 12px;font-size:17px;line-height:1.45;z-index:5;max-height:34%;overflow:auto}
.elog{contain:paint;right:auto;max-width:min(78%,460px);font-size:14px;line-height:1.35;padding:5px 10px;border-radius:12px;background:#0b0811c8;max-height:4.2em;overflow:hidden;pointer-events:none}
.elog .gtip{display:inline;background:none;border:0;padding:0;margin:0;font-size:14px}
.elog.tut{max-width:calc(100% - 16px);max-height:none;font-size:16px}.elog.tut .gtip{font-size:16px;display:block}
#items button[data-k="sos"]{background:#6a1f55;border:2px solid #ff9ad5;color:#fff}#items button[data-k="sos"]:disabled{background:#3a1a33}
.duelbar{position:absolute;left:50%;transform:translateX(-50%);top:64px;z-index:7;background:#2a0f14ee;border:2px solid #ff5a5a;border-radius:14px;padding:8px 14px;font-size:16px;text-align:center;width:max-content;max-width:92%;animation:dpulse 1s infinite alternate}
@keyframes dpulse{to{border-color:#ffd27a;box-shadow:0 0 18px #ff5a5a88}}
.duelcd{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans";font-size:110px;color:#ffd27a;text-shadow:0 0 30px #ff3a4a,0 6px 0 #0008;pointer-events:none}
.duelcd[hidden]{display:none}
.duelcd b{font-weight:400;animation:cdpop .9s ease-out}
@keyframes cdpop{from{transform:scale(2.5);opacity:0}40%{transform:scale(1);opacity:1}}
.raidbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 6px;flex-wrap:wrap}
.raidbar .rb{flex:1;min-width:120px;height:14px;background:#2a0f14;border-radius:99px;overflow:hidden;border:1px solid #ff5a5a66}
.raidbar .rb i{display:block;height:100%;background:linear-gradient(90deg,#ff2a3c,#ff8a3d);transition:width .3s}
.raidbar .who{width:100%;color:var(--mint);font-size:13px}
.inb .toast{top:74px}
.elog .ok{color:var(--mint)}.elog .no{color:var(--bad)}.elog .gold{color:var(--torch)}
.divs{font-size:14px;color:var(--dim);margin-top:2px}.divs b{color:var(--mint);font-weight:400;text-decoration:underline}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);z-index:4;text-align:center;pointer-events:none;filter:drop-shadow(0 6px 0 #0008)}
.tname{display:inline-block;background:#0b0811dd;border-radius:99px;padding:2px 12px;font-size:16px;color:var(--dim);margin-bottom:4px;white-space:nowrap}
.tname .hp{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle}.tname .hp span{width:12px;height:12px;border-radius:2px;background:var(--fire);box-shadow:0 0 5px var(--fire)}
.tname .ph{color:var(--fire);margin-left:5px}
.ttabs{display:flex;align-items:center;justify-content:center;gap:4px}
.tab{background:linear-gradient(#5a4d70,#3a3050);border:4px solid #8a7aa8;border-radius:14px;padding:4px 16px 6px;flex:none;box-shadow:0 0 24px #0009}
.tab .fr{font-size:clamp(34px,9.5vw,54px);margin:0;color:#fff}.tab .fr i{height:5px;border-radius:3px;margin:3px 0}
.tab.txt{font-family:"Black Han Sans";font-size:34px;padding:4px 12px;color:var(--gold)}
.amp{font-family:"Black Han Sans";font-size:30px;color:var(--dim)}.amp.q{color:var(--torch);font-size:28px}
.tag .ab{display:block;font-size:12px;color:var(--ice);margin-top:3px;white-space:nowrap}
.enc{position:absolute;left:8px;right:8px;bottom:8px;background:#0b0811e8;border:1px solid var(--line);border-radius:16px;padding:8px;z-index:5;backdrop-filter:blur(3px)}
.tbar{height:8px;border-radius:4px;background:#18121f;margin:0 0 8px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--torch),var(--mint));transform-origin:left}
.tbar.ice i{background:var(--ice)}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.ask{display:flex;gap:12px;align-items:center;background:#fff4e0;color:#1a1222;border-radius:14px;padding:8px 12px;margin-bottom:8px;font-size:18px;line-height:1.4}
.ask .fr{font-size:34px;color:#1a1222;flex:none}.ask .fr i{height:4px}
.ask b{background:#ffd27a;border-radius:6px;padding:0 6px;font-weight:400;font-family:"Black Han Sans"}
.ask .who{display:block;font-size:14px;color:#8a4a10}
.choices button,.sp{background:linear-gradient(#4a3f5c,#342b44);border:2px solid #5d5073;border-radius:13px;min-height:70px;font-family:"Black Han Sans";font-size:38px;color:var(--torch);box-shadow:0 4px 0 #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .08s}
.choices:not(.q) button{background:#fff4e0;color:#1a1222;border:3px solid #ffb03a;box-shadow:0 5px 0 #8a4a10}
.choices:not(.q) button small{color:#8a6a4a}
.choices:not(.q) button.x{background:#3a2a30;color:var(--bad);border-color:#5a3a40}
.choices.q button{white-space:nowrap;font-size:22px;color:var(--ink);min-height:66px}
.choices button small{font-family:Jua;font-size:11px;color:var(--dim);margin-top:4px}
.sp{width:100%;min-height:40px;font-size:17px;color:var(--ice);margin-top:7px;flex-direction:row;gap:6px}
.choices button:hover:not(:disabled),.sp:hover:not(:disabled){border-color:var(--torch)}
.choices button:active,.sp:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
.choices button.x,.sp.x{opacity:.3;text-decoration:line-through;color:var(--bad)}
.choices.lock button{filter:grayscale(.7) brightness(.7);cursor:wait}
.lockmsg{text-align:center;font-size:14px;color:var(--ice);min-height:0;margin:-2px 0 4px}
.choices button.right{border-color:var(--mint);background:#1f4a40;opacity:1}.choices button.wrong{border-color:var(--bad);background:#4a1f28;opacity:1}
.choices button.glow,.sp.glow{border-color:var(--gold);box-shadow:0 0 18px var(--gold),0 4px 0 #0008;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 30px var(--gold),0 4px 0 #0008}}
.items{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.items button{flex:1 0 64px;white-space:nowrap;background:var(--stone2);border-radius:10px;min-height:42px;font-size:13px;line-height:1.1;padding:3px 2px;box-shadow:0 3px 0 #0007}
.items button.rare{background:linear-gradient(#5a4520,#3a2a12);color:var(--gold)}
.items button:disabled{opacity:.35;cursor:not-allowed}
.wf{position:absolute;transform:translate(-50%,-50%);font-family:"Black Han Sans";font-size:48px;color:var(--mint);text-shadow:0 4px 0 #000,0 0 18px #000;animation:up 1.1s cubic-bezier(.2,1.6,.4,1) forwards;z-index:7;pointer-events:none;white-space:nowrap}
.wf.crit{color:var(--torch);font-size:62px;text-shadow:0 4px 0 #7a2a00,0 0 24px #ff6a3d}.wf.miss{color:var(--bad)}.wf.gold{color:var(--gold);font-size:38px}.wf.small{font-size:28px}
@keyframes up{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-170%) scale(.9);opacity:0}}
.ttabs.pop{animation:pop .35s cubic-bezier(.2,1.8,.4,1)}@keyframes pop{0%{transform:scale(1.5) rotate(-4deg);filter:brightness(2.5)}100%{transform:none;filter:none}}
.ttabs.hit{animation:tshake .3s}@keyframes tshake{20%{transform:translate(-10px,4px) rotate(-3deg)}40%{transform:translate(9px,-3px) rotate(3deg)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,0)}}

/* === 태블릿 화면 자동 최적화: 세로/가로 전환 + 안전 영역 === */
html { min-height: 100%; }
body { -webkit-text-size-adjust: 100%; }
.wrap { padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right)); }
.ov,.cosmodal,.rsmodal { padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right)); }
button, .pill.btnp, .choices button, .items button { touch-action:manipulation; }
/* 태블릿 세로: 탐험 화면 높이를 확보하고 전투 버튼을 크게 */
@media (pointer:coarse) and (orientation:portrait) and (min-width:600px) {
  .wrap { max-width:100%;padding-top:8px; }
  .play { grid-template-columns:minmax(0,1fr); }
  .side { display:none; }
  .mini { display:block;width:clamp(124px,18vw,166px); }
  .stage { height:clamp(540px,calc(100dvh - 132px),1050px); }
  .top { gap:6px;margin-bottom:7px; }
  .top h1 { font-size:clamp(21px,3vw,28px); }
  .enc { padding:12px; }
  .ask { font-size:clamp(18px,2.5vw,24px); }
  .choices button { min-height:clamp(70px,9dvh,92px); }
  .choices.q button { min-height:clamp(62px,8dvh,84px);font-size:clamp(19px,2.5vw,25px); }
  .items button { min-height:44px;font-size:14px; }
  .help { font-size:13px;margin-top:5px; }
}
/* 태블릿 가로: 높이가 제한된 상황에서도 전체 게임판이 보이도록 */
@media (pointer:coarse) and (orientation:landscape) and (min-width:700px) {
  .wrap { max-width:100%;padding-top:5px;padding-bottom:max(4px,env(safe-area-inset-bottom)); }
  .top { gap:5px;margin-bottom:5px; }
  .top h1 { font-size:20px;margin-right:8px; }
  .top .pill { font-size:13px;padding:2px 8px; }
  .top .btnp { min-height:34px; }
  .play { gap:6px;grid-template-columns:minmax(0,1fr); }
  .side { display:none; }
  .mini { display:block;width:clamp(104px,12vw,148px);top:7px;right:7px; }
  .mini.big { width:min(40%,300px);top:7px; }
  .stage { height:clamp(340px,calc(100dvh - 92px),950px);border-radius:13px; }
  .help { font-size:12px;margin:3px 0 0; }
  .elog { max-width:min(65%,390px);font-size:13px; }
  .guide { left:7px;right:7px;bottom:7px;font-size:14px;padding:7px 9px; }
  .guide img { width:42px;height:42px; }
  .enc { left:6px;right:6px;bottom:6px;padding:6px 9px;max-height:76%;overflow-y:auto;overscroll-behavior:contain; }
  .ask { font-size:15px;padding:5px 9px;margin-bottom:5px;gap:8px; }
  .ask .fr { font-size:27px; }
  .raidbar { margin-bottom:3px; }
  .rprob { margin-bottom:3px; }
  .hintbox { padding:5px 8px;margin-bottom:4px; }
  .hintbox .ht { font-size:14px;margin-bottom:3px; }
  .hrow { margin:2px 0; }
  .hc { height:27px!important;min-width:27px!important;font-size:15px!important; }
  .tbar { height:5px;margin-bottom:5px; }
  .choices { gap:5px; }
  .choices button { min-height:clamp(48px,9dvh,68px);font-size:clamp(24px,3.4vw,35px);border-radius:10px; }
  .choices.q button { min-height:clamp(45px,8dvh,58px);font-size:clamp(16px,2.1vw,20px); }
  .sp { min-height:33px;margin-top:4px;font-size:14px; }
  .items { margin-top:4px;gap:3px; }
  .items button { min-height:36px;font-size:11px; }
  .sosrow button { min-height:32px; }
  .duelbar { top:48px;padding:5px 10px;font-size:13px; }
  .duelcd { font-size:76px; }
  .qcard { max-height:70%;overflow-y:auto;font-size:17px;padding:10px; }
  .card { padding:14px; }
  .card h2 { font-size:32px; }
  .ov .card { max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain; }
  #start.ov { min-height:100%; }
}
/* 화면 높이가 매우 낮은 가로 태블릿/분할화면 */
@media (pointer:coarse) and (orientation:landscape) and (max-height:550px) {
  .stage { height:max(290px,calc(100dvh - 66px)); }
  .top { margin-bottom:3px; }
  .top h1 { font-size:17px; }
  .top .pill { font-size:12px;padding:1px 6px; }
  .top .btnp { min-height:28px; }
  .help { display:none; }
  .mini { width:100px; }
  .enc { max-height:86%; }
  .ask { font-size:13px;padding:3px 6px; }
  .choices button { min-height:40px; }
  .choices.q button { min-height:38px; }
  .items button { min-height:30px; }
}
/* 넓은 데스크톱은 기존 사이드 지도 유지. 태블릿 회전 시에는 미니맵 사용 */
@media (pointer:coarse) and (orientation:landscape) and (min-width:860px) {
  .play { grid-template-columns:minmax(0,1fr); }
  .side { display:none; }
  .mini { display:block; }
}
/* 세로 화면이 아주 짧거나 브라우저 분할인 경우 전투 패널 스크롤 */
@media (pointer:coarse) and (orientation:portrait) {
  .enc { max-height:74%;overflow-y:auto;overscroll-behavior:contain; }
}

/* === 스마트폰 터치 조이스틱: 주소창/페이지 스와이프 간섭 방지 === */
html,body { overscroll-behavior-y:none; }
.stage, #cv { touch-action:none !important; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:contain; }
body.joystick-dragging { overscroll-behavior:none; }
@media (pointer:coarse) and (max-width:599px) {
  .stage { height:clamp(400px,calc(100dvh - 106px),820px); }
}

function chReduce({big=false,twin=false,irr=false,small=false}={}){

function genFloor(){
  for(;;){
    const g=Array.from({length:MH},()=>Array(MW).fill(1)),rooms=[];
    const xn=NET.on?Math.max(0,NET.roster.length-1):0;
    for(let t=0;t<600&&rooms.length<7+2*xn;t++){
      const w=5+ri(4),h=5+ri(3),x=1+ri(MW-w-2),y=7+ri(MH-h-8);
      if(rooms.some(o=>x<o.x+o.w+2&&x+w+2>o.x&&y<o.y+o.h+2&&y+h+2>o.y))continue;
      rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
    }
    if(rooms.length<5+2*xn)continue;
    rooms.sort((a,b)=>a.cx-b.cx);
    for(const r of rooms)for(let yy=r.y;yy<r.y+r.h;yy++)for(let xx=r.x;xx<r.x+r.w;xx++)g[yy][xx]=0;
    const dig=(x,y)=>{if(y>0&&y<MH-1&&x>0&&x<MW-1)g[y][x]=0};
    for(let i=1;i<rooms.length;i++){
      const a=rooms[i-1],b=rooms[i];
      for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx)+1;x++){dig(x,a.cy);dig(x,a.cy+1)}
      for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy)+1;y++){dig(b.cx,y);dig(b.cx+1,y)}
    }
    return {g,rooms};
  }
}

const needXP=l=>40+l*20;

const cumXP=l=>{let t=0;for(let i=1;i<l;i++)t+=needXP(i);return t};
const beltProg=p=>{const nb=BELTS.find(x=>x[0]>p.lvl);if(!nb)return 100;const b0=beltOf(p.lvl)[0];return Math.min(100,Math.round((cumXP(p.lvl)+p.xp-cumXP(b0))/(cumXP(nb[0])-cumXP(b0))*100))};

function addXP(name,n,quiet){
  if((G&&G.tut)||!n)return;const p=prof(name);p.xp+=n;const b0=beltOf(p.lvl)[1];
  while(p.xp>=needXP(p.lvl)&&p.lvl<30){p.xp-=needXP(p.lvl);p.lvl++}

  if(!had||(shiny&&!had.s))setTimeout(()=>wfloat(`🃏 ${key}${shiny?' ✨':''} 카드!`,x,y-.9,'gold small'),900);
  if(!had)G.newCards=(G.newCards||0)+1;

  it.k=k;it.why=why;it.who=typeof curName==='function'?pname(curName()):'';G.review.push(it)}
function sheetChallenge(n){const L=[];for(let i=0;i<n;i++){if(SET.mode==='lcm'){let q1,q2;do{q1=2+ri(9);q2=2+ri(9)}while(q1===q2);const f=[q1,q2].map(q=>{let p;do{p=1+ri(q-1)}while(gcd(p,q)!==1);return {p,q}});L.push({t:'l',f,why:'new'})}
  else{const g=2+ri(7);let p,q;do{q=2+ri(8);p=1+ri(q-1)}while(gcd(p,q)!==1);L.push({t:'r',a:p*g,b:q*g,why:'new'})}}return L}
function makeSheet(){
  const W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F=(sz,b)=>`${b?'700 ':''}${sz}px "Jua","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
  const own=(G.review||[]).slice(-10),list=own.concat(sheetChallenge(Math.max(0,6-own.length)));
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#2a2140';x.lineWidth=6;x.strokeRect(30,30,W-60,H-60);
  x.fillStyle='#1a1222';x.textAlign='center';x.font=F(60,1);x.fillText('📝 분수 던전 복습 학습지',W/2,120);
  const d=new Date(),ds=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
  x.font=F(30);x.textAlign='left';const nm=G.party&&G.party.length?G.party.map(m=>pname(m.name)).join(', '):pname(SET.name);
  x.fillText(`이름: ${nm}`,80,185);x.textAlign='right';x.fillText(`날짜: ${ds}`,W-80,185);
  x.fillStyle='#fff4e0';x.fillRect(70,210,W-140,92);x.strokeStyle='#ffb03a';x.lineWidth=3;x.strokeRect(70,210,W-140,92);
  x.fillStyle='#5a3a10';x.textAlign='center';x.font=F(27);
  x.fillText(SET.mode==='lcm'?'통분: 두 분모의 최소공배수를 공통분모로 하면 가장 간단해요.':'약분: 분자와 분모를 최대공약수로 나누면 한 번에 기약분수가 돼요.',W/2,250);
  x.font=F(23);x.fillText(`게임에서 틀렸거나 한 번에 못 푼 문제 ${own.length}개${own.length<6?` + 도전 문제 ${6-own.length}개`:''}`,W/2,285);
  const frac=(cx,cy,a,b,sz)=>{x.font=F(sz,1);x.textAlign='center';const w=Math.max(x.measureText(String(a)).width,x.measureText(String(b)).width)+16;x.fillText(a,cx,cy-sz*.18);x.fillRect(cx-w/2,cy-3,w,5);x.fillText(b,cx,cy+sz*.92);return w};
  const box=(cx,cy,sz)=>{x.lineWidth=3;x.strokeRect(cx-sz*.45,cy-sz*1.05,sz*.9,sz*.85);x.fillRect(cx-sz*.55,cy-3,sz*1.1,5);x.strokeRect(cx-sz*.45,cy+sz*.2,sz*.9,sz*.85)};
  const cols=2,cw=(W-140)/cols,top=330,rh=Math.min(300,(H-top-330)/Math.ceil(list.length/cols));const ans=[];
  list.forEach((it,i)=>{const col=i%cols,row=Math.floor(i/cols),X=70+col*cw,Y=top+row*rh;
    x.strokeStyle='#d8d0e8';x.lineWidth=2;x.strokeRect(X+8,Y+8,cw-16,rh-16);
    x.fillStyle='#2a2140';x.beginPath();x.arc(X+46,Y+48,24,0,7);x.fill();x.fillStyle='#fff';x.font=F(26,1);x.textAlign='center';x.fillText(i+1,X+46,Y+57);
    x.font=F(20);x.textAlign='left';x.fillStyle=it.why==='wrong'?'#c4202a':it.why==='new'?'#127a4a':'#a8640a';
    x.fillText(it.why==='wrong'?'틀린 문제':it.why==='time'?'시간 초과':it.why==='new'?'도전 문제':'한 번에 못 푼 문제',X+80,Y+55);
    x.fillStyle='#1a1222';x.strokeStyle='#1a1222';const cy=Y+Math.min(rh/2+20,150);
    if(rh>230){x.save();x.strokeStyle='#c9c0d8';x.setLineDash([6,8]);x.lineWidth=2;for(let k=0;k<2;k++){const ly=Y+rh-34-k*40;if(ly>cy+100){x.beginPath();x.moveTo(X+80,ly);x.lineTo(X+cw-40,ly);x.stroke()}}x.restore();x.font=F(20);x.fillStyle='#9a8aa8';x.textAlign='left';x.fillText('풀이',X+30,Y+rh-40);x.fillStyle='#1a1222'}
    if(it.t==='r'){const g=gcd(it.a,it.b);
      if(g===1){frac(X+120,cy,it.a,it.b,46);x.font=F(26);x.textAlign='left';x.fillText('더 약분할 수 있나요?',X+180,cy-10);x.fillText('(  예  /  아니오  )',X+180,cy+34);ans.push([i+1,'이미 기약분수'])}
      else{frac(X+110,cy,it.a,it.b,46);x.font=F(44,1);x.textAlign='center';x.fillText('=',X+190,cy+14);box(X+260,cy,56);x.font=F(25);x.textAlign='left';x.fillText('최대공약수: (      )',X+320,cy+12);ans.push([i+1,null,it.a/g,it.b/g,`(최대공약수 ${g})`])}}
    else if(it.t==='l'){const [a,b]=it.f,L=lcm(a.q,b.q);frac(X+90,cy,a.p,a.q,40);x.font=F(36,1);x.fillText(',',X+128,cy+20);frac(X+165,cy,b.p,b.q,40);x.font=F(36,1);x.textAlign='center';x.fillText('→',X+230,cy+12);box(X+290,cy,48);x.font=F(36,1);x.fillText(',',X+328,cy+20);box(X+370,cy,48);x.font=F(22);x.textAlign='left';x.fillText('최소공배수 (       )',X+80,cy+88);ans.push([i+1,null,a.p*L/a.q,L,'',b.p*L/b.q,L])}
    else{const [a,b]=it.f;frac(X+150,cy,a.p,a.q,46);x.lineWidth=3;x.beginPath();x.arc(X+240,cy+10,30,0,7);x.stroke();frac(X+330,cy,b.p,b.q,46);x.font=F(22);x.textAlign='left';x.fillText('○ 안에 >, =, < 를 써요',X+80,cy+88);ans.push([i+1,it.ans])}
  });
  /* 정답 (거꾸로) */
  x.save();x.translate(W/2,H-175);x.rotate(Math.PI);x.fillStyle='#f4f0fa';x.fillRect(-W/2+70,-100,W-140,200);x.fillStyle='#4a3f5c';x.font=F(24,1);x.textAlign='center';x.fillText('✂ 정답 (다 풀고 종이를 거꾸로 돌려 보세요)',0,-62);
  let ax=-W/2+100,ayy=-12;x.textAlign='left';for(const a of ans){if(ax>W/2-250){ax=-W/2+100;ayy+=58}x.font=F(24,1);x.fillText(a[0]+')',ax,ayy+10);let px=ax+x.measureText(a[0]+')').width+12;
    if(a[1]){x.font=F(24);x.fillText(a[1],px,ayy+10);px+=x.measureText(a[1]).width+30}else{px+=frac(px+14,ayy,a[2],a[3],24)+6;if(a[5]!=null){x.font=F(24);x.fillText(',',px,ayy+10);px+=12;px+=frac(px+14,ayy,a[5],a[6],24)+6}if(a[4]){x.font=F(20);x.fillText(a[4],px+6,ayy+10);px+=x.measureText(a[4]).width+10}}
    ax=Math.max(ax+190,px+24)}
  x.restore();x.fillStyle='#9a8aa8';x.font=F(20);x.textAlign='center';x.fillText('분수 던전 · 게임에서 만난 문제로 만든 나만의 복습지',W/2,H-48);
  return c;
}
function openSheet(){const c=makeSheet(),url=c.toDataURL('image/png');let ov=$('sheetov');if(!ov){ov=document.createElement('div');ov.id='sheetov';ov.className='ov sheetov';document.body.appendChild(ov)}
  ov.innerHTML=`<div class="card"><h3 style="margin:4px 0">📝 복습 학습지</h3><p style="margin:0;color:var(--dim);font-size:15px">📱 사진을 <b>꾹 눌러 "이미지 저장"</b>을 고르면 갤러리에 저장돼요.</p><img id="shimg" alt="복습 학습지" src="${url}"><div><button class="btn" id="shSave">💾 갤러리에 저장</button><button class="btn alt" id="shClose">닫기</button></div><p id="shMsg" style="margin:4px 0;color:var(--mint);min-height:22px"></p></div>`;
  ov.classList.add('on');try{ov.scrollTo(0,0)}catch(e){}
  $('shClose').onclick=()=>ov.classList.remove('on');
  $('shSave').onclick=()=>{const fn=`분수던전_복습지_${new Date().toISOString().slice(0,10)}.png`;c.toBlob(async bl=>{try{const file=new File([bl],fn,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'분수 던전 복습 학습지'});$('shMsg').textContent='저장할 곳에서 "이미지 저장"을 골라요!';return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();a.remove();$('shMsg').textContent='다운로드 폴더(사진 앱)에 저장했어요!'},'image/png')};
}
function finish(won){
  G.mode='end';stopMove();
  const rate=G.kills?Math.round(G.oneShots/G.kills*100):0;
  if(won){achGet('clear');if(G.daily)achGet('daily')}
  if(!G.tut)for(const m of G.party||[]){addXP(m.name,won?50:10);if(won)collect(m.name,'2/3',true,G.p.x,G.p.y)}
  let conv='';if(!G.tut&&G.stars>=5){const pts=Math.floor(G.stars/5);for(const m of (G.party||[])){const d=djOf(m.name);d.pts+=pts;d.total+=pts}saveProf();conv=`<span style="color:var(--mint)">💪 남은 별 ${G.stars}개 → 수련 점수 +${pts}</span>`}
  const team=G.party&&G.party.length>1;
  const rec={id:Date.now(),daily:G.daily?today():'',cls:team?'':SET.cls,name:team?'👥 '+G.party.map(m=>m.name).join('·'):(SET.name||'이름 없는 용사'),mode:SET.mode,diff:SET.diff,score:G.score,kills:G.kills,rate,won,floor:G.floor+1};
  RANK.push(rec);RANK.sort((a,b)=>b.score-a.score);RANK=RANK.slice(0,20);store.set('fd-rank-v1',RANK);
  const place=RANK.findIndex(r=>r.id===rec.id)+1;
  const text=`[분수 던전] ${rec.name} · ${modeName(SET.mode)} 던전 ${DIFFS[SET.diff].name} · 점수 ${G.score} · 처치 ${G.kills} · 한 방 ${rate}% · 최고 콤보 ${G.best} · 평균 답 시간 ${avgRt()}초 · 빠른 오답 ${G.fastWrong||0} · ${won?'던전 정복':`지하 ${G.floor+1}층`}`;
  $('endcard').innerHTML=`<div class="big" style="${won?'':'color:var(--bad)'}">${won?'던전 정복! 🏆':'쓰러졌어요…'}</div>
    <p style="margin:6px 0">${won?'분수 던전을 끝까지 탐험했어요!':`지하 ${G.floor+1}층에서 쓰러졌어요.`}</p>
    <div class="chips">${(G.party||[]).map(m=>{const p=profR(m.name);return `<span>${esc(pname(m.name))} 🥋 ${title(p.lvl)}</span>`}).join('')}</div>
    <div class="chips"><span>점수 ⭐ ${G.score}</span><span>처치 ${G.kills}</span><span>한 방 ${G.oneShots} (${rate}%)</span><span>최고 콤보 🔥${G.best}</span><span>빗나감 ${G.misses}</span><span>평균 답 시간 ${avgRt()}초</span><span style="${(G.fastWrong||0)>=3?'color:var(--bad)':''}">너무 빠른 오답 ${G.fastWrong||0}번</span></div>
    ${team?`<div class="scroll"><table><thead><tr><th>모둠원</th><th class="n">점수</th><th class="n">처치</th><th class="n">한 방</th><th class="n">빠른 오답</th></tr></thead><tbody>${G.party.map(m=>`<tr><td>${esc(m.name)} (${CLASSES[m.cls].n})</td><td class="n">${m.score}</td><td class="n">${m.kills}</td><td class="n">${m.oneShots}</td><td class="n">${m.fw||0}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${gainHTML(conv)}
    ${won?'':'<p style="color:var(--dim);margin:4px 0">팁: 힌트 물약으로 공약수를 확인하고, 가장 큰 공약수로 공격해 보세요.</p>'}
    <div><button class="btn" id="sheetBtn" style="background:linear-gradient(#5ee68a,#2fb26a)">📝 복습 학습지${(G.review||[]).length?` (${G.review.length}문제)`:''}</button></div>
    <div><button class="btn" id="again">다시 도전</button><button class="btn alt" id="copy">결과 복사</button><button class="btn alt" id="menu">처음 화면</button></div>
    <p id="copied" style="margin:0;color:var(--mint);min-height:24px"></p>
    <div id="teamStats"></div>
    `;
  $('end').classList.add('on');
  if(NET.on){netSend({t:'stats',id:NET.id,name:myName(),score:G.score,kills:G.kills,one:G.oneShots,fw:G.fastWrong||0,avg:avgRt()});setTimeout(drawTeam,300)}
  $('again').onclick=newGame;$('sheetBtn').onclick=openSheet;
  $('menu').onclick=()=>{drawKing();$('end').classList.remove('on');$('start').classList.add('on');G.mode='menu'};
  $('copy').onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>$('copied').textContent='복사했어요! 선생님이 알려 준 곳에 붙여 넣어요.',()=>$('copied').textContent=text)}catch(e){$('copied').textContent=text}};
}

/* ---------- 시작 화면 ---------- */
function seg(id,list,key){
  const el=$(id);
  const draw=()=>{el.innerHTML=list.map(o=>`<button data-v="${o.v}" aria-pressed="${SET[key]===o.v}">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')};
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const o=list.find(x=>String(x.v)===b.dataset.v);SET[key]=o.v;saveSet();draw();rules()};
  draw();
}
seg('segDiff',DIFFS.map((d,i)=>({v:i,t:d.name,s:d.info})),'diff');
seg('segN',[{v:1,t:'혼자'},{v:2,t:'2명'},{v:3,t:'3명'},{v:4,t:'4명',s:'모둠'}],'n');
function drawParty(){
  const solo=SET.n<2;$('soloName').hidden=!solo;$('soloCls').hidden=!solo;
  $('partyBox').innerHTML=solo?'':`<p style="margin:4px 0;color:var(--dim);font-size:14px;text-align:left">한 기기로 함께 해요. 전투는 한 명씩 차례대로!</p>`+Array.from({length:SET.n},(_,i)=>{const m=SET.members[i]||(SET.members[i]={name:'',cls:'knight'});
    return `<div class="prow"><input data-i="${i}" maxlength="8" placeholder="${i+1}번 친구 이름" value="${esc(m.name)}"><div class="pc">${Object.entries(CLASSES).map(([k,c])=>`<button data-i="${i}" data-c="${k}" aria-pressed="${m.cls===k}" aria-label="${c.n}"><img src="${srcOf(c.art)}" alt=""></button>`).join('')}</div></div>`}).join('');
}
$('partyBox').addEventListener('input',e=>{const i=+e.target.dataset.i;if(e.target.tagName==='INPUT'){SET.members[i].name=e.target.value.trim();saveSet()}});
$('partyBox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SET.members[+b.dataset.i].cls=b.dataset.c;saveSet();drawParty()});
$('segN').addEventListener('click',()=>setTimeout(()=>{drawParty();drawKing()},0));
$('partyBox').addEventListener('change',()=>drawKing());drawParty();
seg('segDaily',[{v:false,t:'일반 던전',s:'매번 새로운 맵'},{v:true,t:'📅 오늘의 던전',s:`${new Date().getMonth()+1}월 ${new Date().getDate()}일 · 모두 같은 맵`}],'daily');
{const el=$('segCls');const draw=()=>{el.innerHTML=Object.entries(CLASSES).map(([k,c])=>`<button data-v="${k}" aria-pressed="${SET.cls===k}"><img src="${srcOf(c.art)}" alt="">${c.n}<small>${c.d}</small></button>`).join('')};
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;SET.cls=b.dataset.v;saveSet();draw()};draw()}
if(SET.ftl==null)SET.ftl=6;
SET.mode='gcd';
if(!SET.ftl5){SET.ftl5=1;SET.ftl=5}
seg('segFtl',[{v:0,t:'끔'},{v:4,t:'4분',s:'빠듯'},{v:5,t:'5분',s:'추천'},{v:6,t:'6분'},{v:8,t:'8분',s:'여유'}],'ftl');
seg('segTimer',[{v:0,t:'끔'},{v:15,t:'15초'},{v:12,t:'12초'},{v:8,t:'8초'}],'timer');
if(!SET.fv5){SET.fv5=1;SET.floors=5}
seg('segFloors',[{v:1,t:'1층',s:'짧게'},{v:2,t:'2층'},{v:3,t:'3층'},{v:4,t:'4층'},{v:5,t:'5층',s:'전체'}],'floors');
function rules(){}
rules();
$('name').value=SET.name;
$('name').addEventListener('input',e=>{SET.name=e.target.value.trim();saveSet();drawKing()});
drawKing();
$('go').onclick=()=>{NET.on=false;BOT=null;BOTS=[];newGame()};
hud();
}
